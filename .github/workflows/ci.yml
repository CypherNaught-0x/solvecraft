name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-tests
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.16.0
      - name: Build opening regression and benchmark
        run: |
          cargo test --profile ci -p solidcraft-cli --test open_performance --no-run
          cargo build --profile ci -p solidcraft-cli
      - name: Measure complete opening test with phase timings
        env:
          SOLIDCRAFT_OPEN_PERF_CHILD: "1"
        run: |
          nproc
          timeout 240 cargo test --profile ci -p solidcraft-cli --test open_performance -- --nocapture
      - name: Compare opening benchmark
        run: timeout 240 target/ci/solidcraft-cli bench-open apps/solidcraft-cli/tests/performance/HardEdgeBasin.solidcraft
